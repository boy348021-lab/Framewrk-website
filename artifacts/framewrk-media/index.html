    <script>
      try {
        const storedTheme = window.localStorage.getItem('framewrk-theme');
        document.documentElement.dataset.theme = storedTheme === 'light' ? 'light' : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
