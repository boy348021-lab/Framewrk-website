<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team section preview</title>
    <style>
      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
        overflow: hidden;
      }
      iframe {
        display: block;
      }
    </style>
  </head>
  <body>
    <iframe id="preview" src="/" title="FrameWrk Media team section"></iframe>
    <script>
      const preview = document.getElementById('preview');
      let attempts = 0;

      function revealTeam() {
        const team = preview.contentDocument?.getElementById('team');
        if (team) {
          const frameWindow = preview.contentWindow;
          frameWindow.scrollTo({
            top: team.getBoundingClientRect().top + frameWindow.scrollY,
            behavior: 'instant',
          });
          return;
        }
        if (attempts++ < 60) window.setTimeout(revealTeam, 100);
      }

      preview.addEventListener('load', () => window.setTimeout(revealTeam, 100));
    </script>
  </body>
</html>
